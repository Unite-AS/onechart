{{- define "common.podSpec.tpl" -}}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}
{{- if .Values.podSecurityContext }}
securityContext:
  runAsNonRoot: {{ hasKey .Values.podSecurityContext "runAsNonRoot" | ternary .Values.podSecurityContext.runAsNonRoot true }}
  runAsUser: {{ hasKey .Values.podSecurityContext "runAsUser" | ternary .Values.podSecurityContext.runAsUser 621 }}
  runAsGroup: {{ hasKey .Values.podSecurityContext "runAsGroup" | ternary .Values.podSecurityContext.runAsGroup 999 }}
  {{- range $key, $value := .Values.podSecurityContext }}
  {{- if not (or (eq $key "runAsNonRoot") (eq $key "runAsUser") (eq $key "allowPrivilegeEscalation")) }}
  {{ $key }}: {{ $value }}
  {{- end }}
  {{- end }}
{{- else }}
securityContext:
  runAsNonRoot: true
  runAsUser: 621
  runAsGroup: 999
{{- end }}
{{- if .Values.serviceAccount }}
serviceAccountName: {{ .Values.serviceAccount }}
{{- end }}
initContainers:
  {{- range .Values.initContainers }}
  - name:  {{ .name }}
    image: "{{ .image }}:{{ .tag }}"
    imagePullPolicy: {{ .imagePullPolicy | default "IfNotPresent" }}
    {{- if .restartPolicy }}
    restartPolicy: {{ .restartPolicy }}
    {{- end }}
    {{- include "common.envFromRef.tpl" $ | nindent 4 }}
    {{- if .command }}
    command:
      - {{ $.Values.shell }}
      - -c
      - {{ .command | quote}}
    {{- end }}
    {{- $initName := .name }}
    {{- $optIn := .volumes | default list }}
    {{- $known := list }}
    {{- range $.Values.volumes }}{{ $known = append $known .name }}{{ end }}
    {{- range $optIn }}
    {{- if not (has . $known) }}
    {{- fail (printf "initContainers.%s.volumes: %s is not in volumes" $initName .) }}
    {{- end }}
    {{- end }}
    volumeMounts:
    {{- range $.Values.volumes }}
    {{- if (or (hasPrefix "shared-" .name) (hasPrefix "init-" .name))}}
    - mountPath: {{ .path }}
      name: {{ .name }}
    {{- else if has .name $optIn }}
    {{- /* Mount like the main container does, so both see the same files */}}
    - mountPath: {{ .path }}
      name: {{ .name }}
      {{- if .subPath }}
      subPath: {{ .subPath }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- if .securityContext }}
    securityContext:
      runAsNonRoot: {{ hasKey .securityContext "runAsNonRoot" | ternary .securityContext.runAsNonRoot true }}
      runAsUser: {{ hasKey .securityContext "runAsUser" | ternary .securityContext.runAsUser 621 }}
      runAsGroup: {{ hasKey .securityContext "runAsGroup" | ternary .securityContext.runAsGroup 999 }}
      allowPrivilegeEscalation: {{ hasKey .securityContext "allowPrivilegeEscalation" | ternary .securityContext.allowPrivilegeEscalation false }}
      readOnlyRootFilesystem: {{ hasKey .securityContext "readOnlyRootFilesystem" | ternary .securityContext.readOnlyRootFilesystem true }}
      {{- with omit .securityContext "runAsNonRoot" "runAsUser" "runAsGroup" "allowPrivilegeEscalation" "readOnlyRootFilesystem" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- else }}
    securityContext:
      runAsNonRoot: true
      runAsUser: 621
      runAsGroup: 999
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    {{- end }}
    {{- with (.resources | default $.Values.initContainerResources) }}
    resources:
    {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
containers:
  {{- $containerTpl := include "common.container.tpl" . | fromYaml }}
  {{- $container := mergeOverwrite $containerTpl .Values.container }}
  - {{ toYaml $container | nindent 4 }}
    {{- include "common.envFromRef.tpl" . | nindent 4 }}
    {{- include "common.volumeMountsRef.tpl" . | nindent 4 }}
  {{- if .Values.sidecar }}
  - name: {{ template "robustName" .Release.Name }}-sidecar
    {{- if .Values.securityContext }}
    securityContext:
      runAsNonRoot: {{ hasKey .Values.securityContext "runAsNonRoot" | ternary .Values.securityContext.runAsNonRoot true }}
      runAsUser: {{ hasKey .Values.securityContext "runAsUser" | ternary .Values.securityContext.runAsUser 621 }}
      runAsGroup: {{ hasKey .Values.securityContext "runAsGroup" | ternary .Values.securityContext.runAsGroup 999 }}
      allowPrivilegeEscalation: {{ hasKey .Values.securityContext "allowPrivilegeEscalation" | ternary .Values.securityContext.allowPrivilegeEscalation false }}
      readOnlyRootFilesystem: {{ hasKey .Values.securityContext "readOnlyRootFilesystem" | ternary .Values.securityContext.readOnlyRootFilesystem true }}
      {{- range $key, $value := .Values.securityContext }}
      {{- if not (has $key (list "runAsNonRoot" "runAsUser" "runAsGroup" "allowPrivilegeEscalation" "readOnlyRootFilesystem")) }}
      {{ $key }}: {{ $value }}
      {{- end }}
      {{- end }}
    {{- else }}
    securityContext:
      runAsNonRoot: true
      runAsUser: 621
      runAsGroup: 999
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    {{- end }}
    image: {{ .Values.sidecar.repository }}:{{ .Values.sidecar.tag }}
    {{- with (.Values.sidecar.resources | default .Values.sidecarResources) }}
    resources:
    {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.sidecar.command }}
    command:
      - {{ .Values.sidecar.shell }}
      - -c
      - {{ .Values.sidecar.command | quote }}
    {{- end }}
    {{- include "common.envFromRef.tpl" . | nindent 4 }}
    {{- include "common.volumeMountsRef.tpl" . | nindent 4 }}
  {{- end }}
{{- include "common.volumesRef.tpl" . }}
{{- with .Values.nodeSelector }}
nodeSelector:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- if or .Values.spreadAcrossNodes .Values.affinity }}
affinity:
  {{- if .Values.spreadAcrossNodes }}
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: "app.kubernetes.io/instance"
              operator: In
              values:
                - {{ template "robustName" .Release.Name }}
        topologyKey: "kubernetes.io/hostname"
  {{- end }}
  {{- if .Values.affinity }}
  {{- toYaml .Values.affinity | nindent 2 }}
  {{- end }}
{{- end }}
{{- with .Values.tolerations }}
tolerations:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
