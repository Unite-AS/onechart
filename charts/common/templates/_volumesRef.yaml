{{- define "common.volumesRef.tpl" }}
{{- if or (or (or (.Values.volumes) (.Values.sealedFileSecrets)) .Values.fileSecrets) .Values.existingFileSecrets }}
volumes:
  {{- range .Values.volumes }}
  - name: {{ .name }}
    {{- $volume := . }}
    {{- if hasKey $volume "serviceAccountToken" }}
    {{- range $key := list "emptyDir" "existingConfigMap" "existingSecret" "fileName" "hostPath" "existingClaim" }}
    {{- if hasKey $volume $key }}
    {{- fail (printf "volumes.%s: serviceAccountToken cannot be combined with %s" $volume.name $key) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if .emptyDir }}
    emptyDir: {}
    {{- else if .existingConfigMap }}
    configMap:
      name: {{ .existingConfigMap }}
    {{- else if .existingSecret }}
    secret:
      secretName: {{ .existingSecret }}
    {{- else if .fileName }}
    configMap:
      name: {{ template "common.robustName" (printf "%s-%s" $.Release.Name .name) }}
    {{- else if hasKey . "serviceAccountToken" }}
    {{- $token := .serviceAccountToken }}
    {{- if not (kindIs "map" $token) }}
    {{- fail (printf "volumes.%s: serviceAccountToken must be a map with an audience" .name) }}
    {{- end }}
    {{- if not (and (kindIs "string" $.Values.serviceAccount) $.Values.serviceAccount) }}
    {{- fail (printf "volumes.%s: serviceAccountToken requires serviceAccount" .name) }}
    {{- end }}
    {{- if .subPath }}
    {{- fail (printf "volumes.%s: serviceAccountToken does not rotate with subPath" .name) }}
    {{- end }}
    {{- /* An empty audience makes the API server issue a token for itself */}}
    {{- $audience := $token.audience | default "" | toString }}
    {{- if not (trim $audience) }}
    {{- fail (printf "volumes.%s: serviceAccountToken.audience is required" .name) }}
    {{- end }}
    {{- /* The token aud claim must match the verifier exactly */}}
    {{- if ne $audience (trim $audience) }}
    {{- fail (printf "volumes.%s: serviceAccountToken.audience must not start or end with whitespace" .name) }}
    {{- end }}
    {{- $expirationSeconds := 600 }}
    {{- if hasKey $token "expirationSeconds" }}
    {{- $expirationSeconds = $token.expirationSeconds | int }}
    {{- end }}
    {{- if or (lt $expirationSeconds 600) (gt $expirationSeconds 4294967296) }}
    {{- fail (printf "volumes.%s: serviceAccountToken.expirationSeconds must be between 600 and 4294967296" .name) }}
    {{- end }}
    {{- $tokenPath := $token.path | default "token" | toString }}
    {{- /* The API server also reserves names that start with '..' (kubelet uses ..data) */}}
    {{- if or (hasPrefix "/" $tokenPath) (hasPrefix ".." $tokenPath) (has ".." (splitList "/" $tokenPath)) }}
    {{- fail (printf "volumes.%s: serviceAccountToken.path must be relative, must not start with '..' and must not contain '..'" .name) }}
    {{- end }}
    projected:
      sources:
        - serviceAccountToken:
            audience: {{ $audience | quote }}
            expirationSeconds: {{ $expirationSeconds }}
            path: {{ $tokenPath | quote }}
    {{- else if .hostPath }}
    hostPath:
      path: {{ .hostPath.path }}
      {{- if .hostPath.type }}
      type: {{ .hostPath.type }}
      {{- end }}
    {{- else }}
    persistentVolumeClaim:
      {{- if .existingClaim }}
      claimName: {{ .existingClaim }}
      {{ else }}
      claimName: {{ printf "%s-%s" $.Release.Name .name }}
      {{- end }}
      {{- end }}
{{- end }}     
  {{- range .Values.sealedFileSecrets }}
  - name: {{ .name }}
    secret:
      secretName: {{ printf "%s-%s" $.Release.Name .name }}
  {{- end }}
  {{- range .Values.fileSecrets }}
  - name: {{ .name }}
    secret:
      secretName: {{ printf "%s-%s" $.Release.Name .name }}
  {{- end }}
  {{- range .Values.existingFileSecrets }}
  - name: {{ .name }}
    secret:
      secretName: {{ .name }}
  {{- end }}
{{- end }}
{{- end }}
