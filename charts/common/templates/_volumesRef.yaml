{{- define "common.volumesRef.tpl" }}
{{- if or (or (or (.Values.volumes) (.Values.sealedFileSecrets)) .Values.fileSecrets) .Values.existingFileSecrets }}
volumes:
  {{- range .Values.volumes }}
  - name: {{ .name }}
    {{- if .emptyDir }}
    emptyDir: {}
    {{- else if .existingConfigMap }}
    configMap:
      name: {{ .existingConfigMap }}
    {{- else if .existingSecret }}
    secret:
      secretName: {{ .existingSecret }}
    {{- else if .fileName }}
    configMap:
      name: {{ template "common.robustName" (printf "%s-%s" $.Release.Name .name) }}
    {{- else if .serviceAccountToken }}
    {{- if not $.Values.serviceAccount }}
    {{- fail (printf "volumes.%s: serviceAccountToken requires serviceAccount" .name) }}
    {{- end }}
    {{- if .subPath }}
    {{- fail (printf "volumes.%s: serviceAccountToken does not rotate with subPath" .name) }}
    {{- end }}
    {{- $expirationSeconds := .serviceAccountToken.expirationSeconds | default 3600 | int }}
    {{- if lt $expirationSeconds 600 }}
    {{- fail (printf "volumes.%s: serviceAccountToken.expirationSeconds must be at least 600" .name) }}
    {{- end }}
    projected:
      sources:
        - serviceAccountToken:
            audience: {{ .serviceAccountToken.audience | quote }}
            expirationSeconds: {{ $expirationSeconds }}
            path: {{ .serviceAccountToken.path | default "token" | quote }}
    {{- else if .hostPath }}
    hostPath:
      path: {{ .hostPath.path }}
      {{- if .hostPath.type }}
      type: {{ .hostPath.type }}
      {{- end }}
    {{- else }}
    persistentVolumeClaim:
      {{- if .existingClaim }}
      claimName: {{ .existingClaim }}
      {{ else }}
      claimName: {{ printf "%s-%s" $.Release.Name .name }}
      {{- end }}
      {{- end }}
{{- end }}     
  {{- range .Values.sealedFileSecrets }}
  - name: {{ .name }}
    secret:
      secretName: {{ printf "%s-%s" $.Release.Name .name }}
  {{- end }}
  {{- range .Values.fileSecrets }}
  - name: {{ .name }}
    secret:
      secretName: {{ printf "%s-%s" $.Release.Name .name }}
  {{- end }}
  {{- range .Values.existingFileSecrets }}
  - name: {{ .name }}
    secret:
      secretName: {{ .name }}
  {{- end }}
{{- end }}
{{- end }}
