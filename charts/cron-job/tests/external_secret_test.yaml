suite: test external secret
templates:
  - externalSecret.yaml
tests:
  - it: Should not render ExternalSecret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: Should render ExternalSecret when externalSecret is enabled
    set:
      secretName: app-secrets
      externalSecret:
        enabled: true
        key: app-secrets-key
        refreshInterval: 30m
        secretStoreRef:
          name: my-kv
          kind: ClusterSecretStore
    release:
      namespace: platform
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: kind
          value: ExternalSecret
      - equal:
          path: metadata.name
          value: app-secrets
      - equal:
          path: metadata.namespace
          value: platform
      - equal:
          path: spec.refreshInterval
          value: 30m
      - equal:
          path: spec.secretStoreRef.name
          value: my-kv
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.dataFrom[0].extract.key
          value: app-secrets-key

  - it: Should render multiple ExternalSecret resources from externalSecrets
    set:
      externalSecrets:
        - name: app-secrets
          key: app-secrets-key
          refreshInterval: 30m
          secretStoreRef:
            name: my-kv
            kind: ClusterSecretStore
        - name: db-secrets
          key: db-secrets-key
          secretStoreRef:
            name: team-kv
    release:
      namespace: platform
    asserts:
      - hasDocuments:
          count: 2

  - it: Should default values for an externalSecrets entry
    set:
      externalSecrets:
        - name: db-secrets
          secretStoreRef:
            name: team-kv
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 1h0m0s
      - equal:
          path: spec.secretStoreRef.name
          value: team-kv
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.dataFrom[0].extract.key
          value: db-secrets

  - it: Should keep the entry secretStoreRef when secretStoreRefOverride.name is empty
    set:
      secretStoreRefOverride:
        name: ""
      externalSecrets:
        - name: db-secrets
          secretStoreRef:
            name: team-kv
            kind: SecretStore
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: team-kv
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore

  - it: Should use secretStoreRefOverride for every externalSecrets entry
    set:
      secretStoreRefOverride:
        name: my-app-kv
        kind: SecretStore
      externalSecrets:
        - name: app-secrets
          secretStoreRef:
            name: azure-key-vault
            kind: ClusterSecretStore
        - name: db-secrets
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.secretStoreRef.name
          value: my-app-kv
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.dataFrom[0].extract.key
          value: app-secrets
        documentIndex: 0
      - equal:
          path: spec.dataFrom[0].extract.key
          value: db-secrets
        documentIndex: 1

  - it: Should use secretStoreRefOverride for the legacy externalSecret
    set:
      secretName: app-secrets
      externalSecret:
        enabled: true
      secretStoreRefOverride:
        name: my-app-kv-preview
        kind: ClusterSecretStore
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: my-app-kv-preview
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.dataFrom[0].extract.key
          value: app-secrets

  - it: Should default the secretStoreRefOverride kind to SecretStore
    set:
      secretName: app-secrets
      externalSecret:
        enabled: true
      secretStoreRefOverride:
        name: my-app-kv
        kind: null
    asserts:
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore

  - it: Should reject an unknown secretStoreRefOverride kind
    set:
      secretName: app-secrets
      externalSecret:
        enabled: true
      secretStoreRefOverride:
        name: my-app-kv
        kind: SomethingElse
    asserts:
      - failedTemplate: {}

  - it: Should use dataFrom.extract by default (json format)
    set:
      externalSecrets:
        - name: app-secrets
    asserts:
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: app-secrets

  - it: Should use dataFrom.find by tag with the keys format
    set:
      externalSecretFormat: keys
      secretStoreRefOverride:
        name: my-app-kv
      externalSecrets:
        - name: app-secrets
        - name: db-secrets
          key: db
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.dataFrom
          value:
            - find:
                tags:
                  k8s-secret: app-secrets
              rewrite:
                - regexp:
                    source: "-"
                    target: "_"
        documentIndex: 0
      - equal:
          path: spec.dataFrom[0].find.tags.k8s-secret
          value: db
        documentIndex: 1
      - equal:
          path: spec.secretStoreRef.name
          value: my-app-kv

  - it: Should use the keys format for the legacy externalSecret
    set:
      secretName: app-secrets
      externalSecret:
        enabled: true
      externalSecretFormat: keys
    asserts:
      - equal:
          path: spec.dataFrom[0].find.tags.k8s-secret
          value: app-secrets
      - notExists:
          path: spec.dataFrom[0].extract

  - it: Should reject an unknown externalSecretFormat
    set:
      secretName: app-secrets
      externalSecret:
        enabled: true
      externalSecretFormat: yaml
    asserts:
      - failedTemplate: {}
