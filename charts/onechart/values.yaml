#   tlsEnabled: true
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-staging
#   nginxBasicAuth:
#     user: admin
#     password: secret

gatewayApi:
  # Enable rendering of Gateway API HTTPRoute resources.
  # Route input can come from gatewayApi.route/gatewayApi.routes directly.
  # If both are omitted, ingress/ingresses are reused as a fallback.
  enabled: false
  # Optional direct single route definition.
  # route:
  #   host: chart-example.local
  #   path: /
  #   pathType: Prefix
  # Optional direct multi route definitions.
  # routes:
  #   - name: myapp-public
  #     host: chart-example.local
  #   - name: myapp-metrics
  #     host: chart-example.local
  #     paths:
  #       - path: /metrics
  #         pathType: Exact
  # Parent Gateway references for backend HTTPS routes.
  # Defaults point to the platform-managed shared edge Gateway https listener.
  # Applications should usually not need to change these values.
  # Ingress remains independent; enabling this does not disable ingress rendering.
  parentRefs:
    - name: edge-shared
      namespace: kong
      sectionName: https
  # HTTP->HTTPS redirect route configuration.
  # By default, each route also renders an HTTP listener route with RequestRedirect to HTTPS.
  httpRedirect:
    enabled: true
    statusCode: 301
    parentRefs:
      - name: edge-shared
        namespace: kong
        sectionName: http

# vars:
#   MY_VAR: "value"

replicas: 1

rollout:
  enabled: false
  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: true
    previewIngress:
      private: true

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 999
  runAsUser: 621
  runAsNonRoot: true
  runAsGroup: 999

securityContext: {}

containerPort: 80

resources:
  requests:
    cpu: "200m"
    memory: "200Mi"
  limits:
    cpu: "200m"
    memory: "200Mi"

nodeSelector: {}

tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

probe:
  enabled: false
  path: "/"
  settings:
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

# Before you use a liveness probe: https://srcco.de/posts/kubernetes-liveness-probes-are-dangerous.html
livenessProbe:
  enabled: false
  path: "/"
  settings:
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

startupProbe:
  enabled: false
  path: "/"
  settings:
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

secretEnabled: false

shell: "/bin/sh"

podDisruptionBudgetEnabled: true
spreadAcrossNodes: false

nodePortEnabled: false

# Set true to enable service monitor.
monitor:
  enabled: false

autoscale:
  enabled: false
  minReplicas: 1

container: {}
podSpec: {}

externalSecrets: []

externalSecret:
  enabled: false
  # Defaults to secretName when omitted.
  key: ""
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
