suite: test deployment
templates:
  - deployment.yaml
  - configmap.yaml
  - pvc.yaml
tests:
  - it: Should mount volume
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          size: 10Gi
          storageClass: default
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: data
              mountPath: /var/lib/1clickinfra/data
  - it: Should reference volume
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          size: 10Gi
          storageClass: default
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: data
              persistentVolumeClaim:
                claimName: RELEASE-NAME-data
  - it: Should recreate to avoid stuck deployments
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          size: 10Gi
          storageClass: default
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.strategy.type
          value: Recreate
  - it: Should strategy take precedence
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          size: 10Gi
          storageClass: default
      strategy: RollingUpdate
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.strategy.type
          value: RollingUpdate
  - it: Should recreate based on autoscale minReplicas rather than the static replicas value
    set:
      replicas: 2
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          size: 10Gi
          storageClass: default
      autoscale:
        enabled: true
        minReplicas: 1
        maxReplicas: 10
      resources:
        limits:
          cpu: 100m
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.strategy.type
          value: Recreate
  - it: Should not recreate when autoscale minReplicas is greater than 1
    set:
      replicas: 1
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          size: 10Gi
          storageClass: default
      autoscale:
        enabled: true
        minReplicas: 2
        maxReplicas: 10
      resources:
        limits:
          cpu: 100m
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        notEqual:
          path: spec.strategy.type
          value: Recreate
  - it: Should strategy be set
    set:
      strategy: Dummy
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.strategy.type
          value: Dummy
  - it: Should use the existing claim
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          existingClaim: my-static-claim
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: data
              persistentVolumeClaim:
                claimName: my-static-claim
  - it: Should use emptyDir
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          emptyDir: true
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: data
              emptyDir: {}
  - it: Should use hostPath
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          hostPath:
            path: /somewhere/over/the/rainbow
            type: DirectoryOrCreate
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: data
              hostPath:
                path: /somewhere/over/the/rainbow
                type: DirectoryOrCreate
  - it: Should use hostPath without type
    set:
      volumes:
        - name: data
          path: /var/lib/1clickinfra/data
          hostPath:
            path: /somewhere/over/the/rainbow
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: data
              hostPath:
                path: /somewhere/over/the/rainbow
  - it: Should use emptyDir
    set:
      volumes:
        - name: myScratchDisk
          path: /randomPath
          emptyDir: true
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: myScratchDisk
              emptyDir: {}
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: myScratchDisk
              mountPath: /randomPath
  - it: Should use a configMap
    set:
      volumes:
        - existingConfigMap: my-configmap
          name: volume-name
          path: /randomPath/app.conf
          subPath: app.conf
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: volume-name
              configMap:
                name: my-configmap
  - it: Should use an existing secret as volume
    set:
      volumes:
        - existingSecret: my-secret
          name: volume-name
          path: /randomPath/app.creds
          subPath: app.creds
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: volume-name
              secret:
                secretName: my-secret
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: volume-name
              mountPath: /randomPath/app.creds
              subPath: app.creds
  - it: Should use a configmap with custom value
    set:
      volumes:
        - name: volume-name
          fileName: myfile.conf
          fileContent: |
              blablabla
              bla
          path: /randomPath/myfile.conf
          subPath: myfile.conf
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: volume-name
              configMap:
                name: release-name-volume-name
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: volume-name
              mountPath: /randomPath/myfile.conf
              subPath: myfile.conf
  - it: Should mount a volume only for the init container
    set:
      initContainers:
        - name : pod
          image: debian
          tag: v1.0.0
      volumes:
        - name: init-volume
          path: /data
          emptyDir: true
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
          - name: init-volume
            emptyDir: {} 
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
          - name: init-volume
            mountPath: /data 
      - template: deployment.yaml
        documentIndex: 0
        notEqual:
          path: spec.template.spec.containers[0].volumeMounts
          value:
          - name: init-volume
            emptyDir: {}
  - it: Should mount a shared volume between the main container and the init container
    set:
      initContainers:
        - name : pod
          image: debian
          tag: v1.0.0
      volumes:
        - name: shared-volume
          path: /data
          emptyDir: true
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
          - name: shared-volume
            mountPath: /data
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
          - name: shared-volume
            mountPath: /data      
  - it: Should project a service account token
    set:
      serviceAccount: my-app
      volumes:
        - name: anthropic-token
          path: /var/run/secrets/anthropic.com
          serviceAccountToken:
            audience: https://api.anthropic.com
            expirationSeconds: 1200
            path: identity
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes
          value:
            - name: anthropic-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: https://api.anthropic.com
                      expirationSeconds: 1200
                      path: identity
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: anthropic-token
              mountPath: /var/run/secrets/anthropic.com
      - template: deployment.yaml
        documentIndex: 0
        notExists:
          path: spec.strategy
      - template: pvc.yaml
        hasDocuments:
          count: 0
  - it: Should default the service account token expiry and file name
    set:
      serviceAccount: my-app
      volumes:
        - name: token
          path: /var/run/secrets/example.com
          serviceAccountToken:
            audience: "123"
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken
          value:
            audience: "123"
            expirationSeconds: 600
            path: token
  - it: Should still recreate a single replica when a disk sits next to the token
    set:
      serviceAccount: my-app
      volumes:
        - name: token
          path: /var/run/secrets/example.com
          serviceAccountToken:
            audience: example.com
        - name: data
          path: /data
          size: 1Gi
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.strategy.type
          value: Recreate
  - it: Should require a service account for a service account token
    set:
      volumes:
        - name: token
          path: /var/run/secrets/example.com
          serviceAccountToken:
            audience: example.com
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorMessage: "volumes.token: serviceAccountToken requires serviceAccount"
  - it: Should reject a service account token without an audience
    set:
      serviceAccount: my-app
      volumes:
        - name: token
          path: /var/run/secrets/example.com
          serviceAccountToken:
            expirationSeconds: 600
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: "audience is required|missing property 'audience'"
  - it: Should reject a service account token mounted with subPath
    set:
      serviceAccount: my-app
      volumes:
        - name: token
          path: /var/run/secrets/example.com/token
          subPath: token
          serviceAccountToken:
            audience: example.com
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: "(?i)additional propert(y|ies) '?subPath'? (is )?not allowed"
  - it: Should reject a service account token that expires in under 600 seconds
    set:
      serviceAccount: my-app
      volumes:
        - name: token
          path: /var/run/secrets/example.com
          serviceAccountToken:
            audience: example.com
            expirationSeconds: 300
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: "expirationSeconds(: Must be greater than or equal to 600|': minimum: got 300, want 600)"
