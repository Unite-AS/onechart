suite: test httproute
templates:
  - httproute.yaml
tests:
  - it: Should not render by default
    set:
      ingress:
        host: chart-example.local
    asserts:
      - hasDocuments:
          count: 0

  - it: Should render HTTPRoute from ingress with defaults
    set:
      gatewayApi:
        enabled: true
      ingress:
        host: chart-example.local
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: release-name
      - documentIndex: 0
        equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - documentIndex: 0
        equal:
          path: kind
          value: HTTPRoute
      - documentIndex: 0
        equal:
          path: spec.parentRefs
          value:
            - name: edge-shared
              namespace: kong
              sectionName: https
      - documentIndex: 0
        equal:
          path: spec.hostnames[0]
          value: chart-example.local
      - documentIndex: 0
        equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /
      - documentIndex: 0
        equal:
          path: spec.rules[0].backendRefs[0].name
          value: release-name
      - documentIndex: 0
        equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
      - documentIndex: 1
        equal:
          path: metadata.name
          value: release-name-http-redirect
      - documentIndex: 1
        equal:
          path: spec.parentRefs
          value:
            - name: edge-shared
              namespace: kong
              sectionName: http
      - documentIndex: 1
        equal:
          path: spec.rules[0].filters[0]
          value:
            type: RequestRedirect
            requestRedirect:
              scheme: https
              statusCode: 301

  - it: Should map ingress pathType to HTTPRoute path type
    set:
      gatewayApi:
        enabled: true
      ingress:
        host: chart-example.local
        path: /metrics
        pathType: Exact
    asserts:
      - documentIndex: 0
        equal:
          path: spec.rules[0].matches[0].path
          value:
            type: Exact
            value: /metrics
      - documentIndex: 1
        equal:
          path: spec.rules[0].matches[0].path
          value:
            type: Exact
            value: /metrics

  - it: Should use svcPort over containerPort
    set:
      gatewayApi:
        enabled: true
      ingress:
        host: chart-example.local
      svcPort: 1234
      containerPort: 5678
    asserts:
      - documentIndex: 0
        equal:
          path: spec.rules[0].backendRefs[0].port
          value: 1234

  - it: Should allow disabling HTTP redirect route
    set:
      gatewayApi:
        enabled: true
        httpRedirect:
          enabled: false
      ingress:
        host: chart-example.local
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: release-name

  - it: Should render multiple HTTPRoutes from ingresses
    set:
      gatewayApi:
        enabled: true
      ingresses:
        - host: chart-example.local
        - host: another.local
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        equal:
          path: metadata.name
          value: release-name-chart-example-local
      - documentIndex: 1
        equal:
          path: metadata.name
          value: release-name-chart-example-local-http-redirect
      - documentIndex: 2
        equal:
          path: metadata.name
          value: release-name-another-local
      - documentIndex: 3
        equal:
          path: metadata.name
          value: release-name-another-local-http-redirect

  - it: Should use explicit route name when provided
    set:
      gatewayApi:
        enabled: true
      ingresses:
        - name: app-public
          host: chart-example.local
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: app-public
      - documentIndex: 1
        equal:
          path: metadata.name
          value: app-public-http-redirect
