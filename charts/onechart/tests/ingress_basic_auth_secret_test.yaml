suite: test nginx basic auth secret
templates:
  - basic-auth.yaml
tests:
  - it: Should set Ingress host name
    set:
      ingress:
        host: chart-example.local
        nginxBasicAuth:
          user: admin1
          password: secret1
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: data.auth

  - it: Shouldnt generate extra secret
    set:
      ingresses:
      - host: chart-example.local
        annotations:
          kubernetes.io/ingress.class: nginx
    asserts:
      - hasDocuments:
          count: 0

  - it: Should not generate secret when ingress resources are disabled
    set:
      ingress:
        resourcesEnabled: false
        host: chart-example.local
        nginxBasicAuth:
          user: admin1
          password: secret1
    asserts:
      - hasDocuments:
          count: 0
