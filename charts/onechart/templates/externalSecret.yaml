{{- $externalSecrets := .Values.externalSecrets | default (list) -}}
{{- if and (eq (len $externalSecrets) 0) (and .Values.externalSecret .Values.externalSecret.enabled) -}}
{{- $externalSecrets = list (dict
  "name" .Values.secretName
  "key" .Values.externalSecret.key
  "refreshInterval" .Values.externalSecret.refreshInterval
  "secretStoreRef" .Values.externalSecret.secretStoreRef
) -}}
{{- end -}}

{{- /* Platform-controlled: when secretStoreRefOverride.name is set, every ExternalSecret uses that store. */ -}}
{{- $override := .Values.secretStoreRefOverride | default (dict) -}}
{{- /* Platform-controlled: "json" = 1 vault secret with a JSON object; "keys" = 1 vault secret per key, grouped by tag. */ -}}
{{- $format := .Values.externalSecretFormat | default "json" -}}

{{- range $es := $externalSecrets }}
{{- $name := required "name is required for each externalSecrets entry" (default $.Values.secretName $es.name) -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ default "1h0m0s" $es.refreshInterval | quote }}
  secretStoreRef:
    {{- if $override.name }}
    name: {{ $override.name | quote }}
    kind: {{ default "SecretStore" $override.kind | quote }}
    {{- else }}
    name: {{ dig "secretStoreRef" "name" "azure-key-vault" $es | quote }}
    kind: {{ dig "secretStoreRef" "kind" "ClusterSecretStore" $es | quote }}
    {{- end }}
  dataFrom:
    {{- if eq $format "keys" }}
    # 1 vault secret per key, tagged k8s-secret=<key>. Vault names cannot contain "_", so DB-HOST becomes DB_HOST.
    - find:
        tags:
          k8s-secret: {{ default $name $es.key | quote }}
      rewrite:
        - regexp:
            source: "-"
            target: "_"
    {{- else }}
    - extract:
        key: {{ default $name $es.key | quote }}
    {{- end }}
{{ end }}
